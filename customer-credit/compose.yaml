version: "3.8"

networks:
  orders-service_kafka_network:
    external: true
  default:
    driver: bridge

services:
  customer-credit:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: customer-credit
    restart: always
    env_file: .env
    environment:
      NODE_ENV: "production"
      PORT: "5015"
      API_KEY: "supersecret"

      # 👇 Igual que customer-service
      KAFKA_BROKER: "kafka:9092"
      KAFKA_CLIENT_ID: "customer-credit"
      KAFKA_GROUP_ID: "customer-credit-consumer"
      KAFKA_TOPIC_CUSTOMER_CREDIT_UPSERT: "customer.credit.upsert"
      TOPIC_PREORDER_CREATED: "preorder.created"
      TOPIC_PREORDER_CANCELLED: "preorder.cancelled"
      TOPIC_ORDER_AUTHORIZED: "order.authorized"
      TOPIC_ORDER_CANCELLED:  "order.cancelled"
      TOPIC_ORDER_INVOICED:   "order.invoiced"
      TOPIC_PAYMENT_RECEIVED: "payment.received"
      # MSSQL
      SQL_SERVER_HOST: "host.docker.internal"
      SQL_SERVER_PORT: "1433"
      SQL_SERVER_USER: "credit_user"
      SQL_SERVER_PASS: "Mimbral1579"
      SQL_SERVER_DB: "customer_credit_db"
      SQL_ENCRYPT: "false"
    ports:
      - "5015:5015"
    networks:
      - orders-service_kafka_network
      - default
