version: '3.8'

networks:
  orders-service_kafka_network:
    external: true  # 📌 Usa la misma red de `orders-service`

services:
  user-service:
    build: .
    container_name: user-service
    restart: always
    ports:
      - "5002:5002"
    environment:
      PORT: 5002
      DB_HOST: host.docker.internal 
      DB_USER: Marcelo
      DB_PASSWORD: Mimbral_!234
      DB_NAME: user_service_db
      DB_PORT: 1433
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: user-service
    networks:
      - orders-service_kafka_network