version: '3.8'

networks:
  # Define la red externa que usarán todos los servicios
  orders-service_kafka_network:
    external: true

services:
  zookeeper:
    image: wurstmeister/zookeeper
    container_name: zookeeper
    restart: always
    ports:
      - "2181:2181"
    networks:
      - orders-service_kafka_network # 👈 Cambiado a la red compartida

  kafka:
    image: wurstmeister/kafka
    container_name: kafka
    restart: always
    ports:
      - "9092:9092"
    environment:
      KAFKA_LISTENERS: PLAINTEXT://0.0.0.0:9092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092
      KAFKA_ZOOKEEPER_CONNECT: zookeeper:2181
      KAFKA_OPTS: "-Djava.net.preferIPv4Stack=true"
    depends_on:
      - zookeeper
    networks:
      - orders-service_kafka_network # 👈 Cambiado a la red compartida

  orders-service:
    build: .
    container_name: orders-service
    restart: always
    ports:
      - "5000:5000"
    depends_on:
      - kafka
    extra_hosts:
      - "host.docker.internal:host-gateway"
      - "win-hp03dio6fsk:192.168.0.165"
    environment:
      PORT: 5000
      DB_HOST: host.docker.internal
      DB_USER: williams
      DB_PASSWORD: Mimbral1579
      DB_NAME: orders_service_db
      DB_PORT: 1433
      VTEX_APP_KEY: ${VTEX_APP_KEY}
      VTEX_APP_TOKEN: ${VTEX_APP_TOKEN}
      SAP_SL_BASE_URL: ${SAP_SL_BASE_URL}
      SAP_SL_COMPANYDB: ${SAP_SL_COMPANYDB}
      SAP_SL_USER: ${SAP_SL_USER}
      SAP_SL_PASSWORD: ${SAP_SL_PASSWORD}
      SAP_SL_SESSION: ${SAP_SL_SESSION}
      KAFKA_BROKER: kafka:9092
      KAFKA_CLIENT_ID: orders-service
      PICKING_URL: http://picking-service:5001/api/picking
    networks:
      - orders-service_kafka_network # 👈 Ahora solo necesitas esta red